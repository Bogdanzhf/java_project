spring:
  application:
    name: currency-rate-parser
  datasource:
    url: jdbc:h2:file:./data/currencydb;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  error:
    include-message: always
parser:
  refresh-delay-ms: 3600000
  cbr-url: https://www.cbr.ru/scripts/XML_daily.asp
  default-currencies: USD,EUR,CNY,GBP,JPY
logging:
  level:
    ru.roadmap.currency: INFO
